[package]
name = "devman"
version = "0.1.0"
edition = "2024"

[dependencies]
addr = "0.15.6"
clap = { version = "4.6.6", features = ["derive", "cargo"]}
clap_complete = "4.6.9"
libc = "0.2.189"
regex = "1.13.1"
sqlx = { version = "0.9.0", features = ["any", "mysql", "postgres", "sqlite", "runtime-tokio", "tls-rustls"]}
sudo = "0.6.0"
tokio = { version = "1.53.1", features = ["full"]}
users = "0.11.0"

[profile.release]
opt-level = 3          # Maximum optimization (0-3, or "s"/"z" for size)
lto = true             # Enable link-time optimization
codegen-units = 1      # Better optimization, slower compile
panic = "abort"        # Smaller binary, no unwinding
strip = true           # Remove symbols from binary
